name: cloudsentinel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudsentinel
      POSTGRES_PASSWORD: cloudsentinel
      POSTGRES_DB: cloudsentinel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    # Kafka-compatible broker: single binary, no ZooKeeper — much lighter for local dev.
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow:/mlflow"]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      CS_DATABASE_URL: postgresql+psycopg://cloudsentinel:cloudsentinel@postgres:5432/cloudsentinel
      CS_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    # Streaming consumer: reads events, computes features, scores, emits alerts.
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["cloudsentinel", "stream", "consume"]
    environment:
      CS_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      CS_DATABASE_URL: postgresql+psycopg://cloudsentinel:cloudsentinel@postgres:5432/cloudsentinel
    volumes: ["./data:/app/data"]
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/dashboard.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cloudsentinel
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  mlflow:
