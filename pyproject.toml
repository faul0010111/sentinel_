[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudsentinel"
version = "0.1.0"
description = "AI-Driven Behavioral Threat Detection & Cloud Security Intelligence Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["cloud-security", "anomaly-detection", "graph-analytics", "mlops", "detection-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "scipy>=1.13",
  "shap>=0.45",
  "networkx>=3.3",
  "matplotlib>=3.9",
  "seaborn>=0.13",
]
# See docs/adr/0002: jax[cpu] installs from PyPI without the ~4 GB CUDA payload
# that the Linux torch wheel pulls in for a workload that never leaves the CPU.
deep = ["jax[cpu]>=0.4.30"]
deep-torch = ["torch>=2.3"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
streaming = ["confluent-kafka>=2.4"]
mlops = ["mlflow>=2.14", "evidently>=0.4"]
dev = [
  "pytest>=8.2", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "httpx>=0.27",
  "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7",
  "bandit>=1.7", "pip-audit>=2.7", "detect-secrets>=1.5",
  "jupyter>=1.0",
]
all = ["cloudsentinel[ml,deep,api,streaming,mlops,dev]"]

[project.scripts]
cloudsentinel = "cloudsentinel.cli:app"

[project.urls]
Repository = "https://github.com/USERNAME/cloudsentinel"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudsentinel"]

[tool.hatch.build.targets.wheel.force-include]
"src/cloudsentinel/py.typed" = "cloudsentinel/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
# 3.12: jax ships stubs using PEP 695 type-parameter syntax, which mypy only
# parses when the target version allows it. The package itself still supports
# 3.11 — CI type-checks on 3.12 and runs tests on both.
python_version = "3.12"
packages = ["cloudsentinel"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: long-running tests (training, full pipeline)",
  "integration: requires docker services",
  "ml: model training / evaluation tests",
]

[tool.coverage.run]
source = ["src/cloudsentinel"]
branch = true

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]
